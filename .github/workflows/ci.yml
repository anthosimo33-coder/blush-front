# La CI de BLUSH. Chaque pull request et chaque push sur main passent les vérifications (types, lint, mise en forme,
# tests et leur seuil de couverture, migrations, build du back-end et sa vérification des prompts), puis les tests de
# bout en bout dans Chromium et WebKit. On ne déploie plus depuis un dossier local.
#
# La mise en production est un geste, jamais l’effet d’un push : « Run workflow » sur main (onglet Actions), ou
# `gh workflow run CI --ref main`. Ce lancement refait toutes les vérifications sur la tête de main, puis déploie. Le
# dépôt est public : tout ce qui y est commité se lit par n’importe qui, seuls les prompts restent privés (le
# sous-module blush-prompts). Ni règle de branche, ni relecteur obligatoire, ni secret d’environnement : c’est ce
# lancement à la main qui tient lieu d’accord.
#
# Ce qu’elle attend du dépôt (README.md, « La CI ») :
#   - le secret PROMPTS_TOKEN : un jeton GitHub (fine-grained) qui lit blush-front et blush-prompts (le sous-module privé) ;
#   - le secret VERCEL_TOKEN : un jeton Vercel qui déploie le projet blush-front.
# Les actions sont épinglées à un commit (leur version en commentaire) : une étiquette déplacée ne change rien ici.
name: CI

# Sur les pull requests et sur main : une branche poussée sans PR ne lance rien (un push et sa PR ne la lançaient pas
# deux fois pour le même commit)
on:
  push:
    branches: [main]
  pull_request:
  # La mise en production (job deployer), lancée à la main sur main
  workflow_dispatch:

# Un nouveau push remplace le run de la même branche encore en cours. Sur main, le run en cours va jusqu’au bout : seul
# celui qui attend son tour est remplacé par le plus récent. Les lancements à la main ont leur propre file : un push
# n’annule jamais une mise en production demandée.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'production' || 'verifications' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifications et build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # La base des tests unitaires : créée puis migrée par tests/preparer-la-base.ts
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/blush_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Le code, avec le sous-module privé prompts/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.PROMPTS_TOKEN }}
          persist-credentials: false

      - name: Node (la version de Vercel, .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Le Postgres 16 déjà installé sur l’image ubuntu-24.04 : pas d’image Docker à tirer (Docker Hub limite les
      # téléchargements anonymes depuis les machines de GitHub)
      - name: Postgres 16 (celui du runner)
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - run: npm ci

      - name: Types, lint, mise en forme, migrations, typographie, code mort, tests et leur couverture (npm run check)
        run: npm run check

      - name: Build du back-end (prebuild, next build, puis la vérification des prompts)
        run: npm run e2e:build

  e2e:
    name: E2E (${{ matrix.navigateur }})
    needs: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Les deux navigateurs vont au bout : un échec dans l’un ne cache pas l’état de l’autre
      fail-fast: false
      matrix:
        include:
          - navigateur: chromium
            projets: --project=chromium --project=chromium-beta
          - navigateur: webkit
            projets: --project=webkit-iphone --project=webkit-iphone-beta
    env:
      # Le serveur Postgres des tests (tests/e2e/serveur.mjs y recrée blush_e2e à chaque lancement)
      E2E_POSTGRES: postgres://postgres:postgres@localhost:5432
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Chaque job construit avec le sous-module : le build contient les prompts (côté serveur), il ne sort jamais du
      # job (un artefact se télécharge par quiconque lit le dépôt)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.PROMPTS_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Le navigateur, en cache (sa version suit package-lock.json)
        id: navigateurs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.navigateur }}-${{ hashFiles('package-lock.json') }}

      - name: Le navigateur et ses bibliothèques système
        if: steps.navigateurs.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.navigateur }}

      - name: Les bibliothèques système du navigateur (le navigateur vient du cache)
        if: steps.navigateurs.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.navigateur }}

      - name: Le build du back-end, pour les tests de bout en bout
        run: npm run e2e:build

      # Le Postgres 16 déjà installé sur l’image ubuntu-24.04 : pas d’image Docker à tirer (Docker Hub limite les
      # téléchargements anonymes depuis les machines de GitHub)
      - name: Postgres 16 (celui du runner)
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: Les tests de bout en bout
        run: npm run e2e -- ${{ matrix.projets }}

      - name: Le rapport et les traces, en cas d’échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.navigateur }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deployer:
    name: Mise en production (Vercel)
    # Seulement lancée à la main, sur main : un push ne met jamais en production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [verifier, e2e]
    runs-on: ubuntu-24.04
    # Le build chez Vercel, puis la vérification (quelques minutes au pire) et, s’il le faut, le retour arrière
    timeout-minutes: 30
    # Pas d’environnement GitHub : Vercel garde l’historique des mises en production
    # Une mise en production à la fois, dans l’ordre des lancements
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # Le projet Vercel (les mêmes que .vercel/project.json, qui n’est pas commité) : des identifiants, pas des secrets
      VERCEL_ORG_ID: team_K67R5gXFJUCr6pCA4YLkgwwH
      VERCEL_PROJECT_ID: prj_rbFHQuTvI4cqSUdmeuDEUTUDZmjZ
      VERCEL_TELEMETRY_DISABLED: "1"
      # La CLI de scripts/deployer, et l’adresse de la production (BLUSH_URL, src/server/env.ts : son défaut)
      VERCEL: scripts/deployer/node_modules/.bin/vercel
      DOMAINE: https://www.askblush.com
    steps:
      # « Re-run » d’un ancien lancement redéploierait son commit : seule la tête de main part en production
      - name: Le commit est toujours la tête de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tete="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          test "$tete" = "$GITHUB_SHA" || { echo "::error::$GITHUB_SHA n’est plus la tête de main ($tete) : lance un nouveau « Run workflow » sur main"; exit 1; }

      # Le sous-module part avec le code : Vercel construit sur ses serveurs, avec ses variables (et y migre la base)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.PROMPTS_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # La CLI Vercel depuis son lockfile (versions et empreintes figées), sans ses scripts d’installation, et sans le
      # jeton : rien de ce qui s’installe ne le voit passer
      - name: La CLI Vercel (scripts/deployer)
        run: npm ci --prefix scripts/deployer --ignore-scripts --no-audit --no-fund

      # Le déploiement en ligne avant celui-ci (celui que sert le domaine) : le retour arrière le remettra si le nouveau ne
      # répond pas. Sans lui (une lecture qui échoue), la mise en production part quand même, sans retour arrière possible.
      - name: Le déploiement en ligne avant
        id: avant
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if id="$("$VERCEL" inspect "$DOMAINE" --format json --token "$VERCEL_TOKEN" | jq -er .id)"; then
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "En ligne avant : $id"
          else
            echo "::warning::Le déploiement en ligne n’a pas pu être lu : pas de retour arrière si le nouveau ne répond pas."
          fi

      # La CLI n’écrit que l’adresse du déploiement sur sa sortie (le reste va aux logs) : on la garde pour la vérifier
      - name: vercel deploy --prod
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$("$VERCEL" deploy --prod --yes --token "$VERCEL_TOKEN")"
          [[ "$url" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::La CLI n’a pas rendu d’adresse de déploiement : « $url »"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé : $url"

      # Le build ne voit pas une variable d’environnement mal mise : env() ne la vérifie qu’à la première requête, et
      # toutes les routes répondent alors « panne » (BACKEND.md, « Mise en ligne »). Le nouveau déploiement doit donc
      # répondre avant de laisser le job au vert : / en 200, et /api/reveil {"ok":true} (la base répond, la configuration
      # est acceptée). D’abord sur son adresse à lui, si la protection des déploiements de Vercel la laisse lire (sinon
      # 401 : elle est sautée), puis sur le domaine, une fois sûr qu’il le sert. Au pire quatre minutes par adresse.
      - name: Le nouveau déploiement répond
        id: verifier
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Cinq essais, 10 s d’écart : une instance qui démarre ou une base qui se réveille n’est pas une panne
          repond() {
            curl --fail --silent --show-error --location --max-time 20 --retry 4 --retry-delay 10 --retry-all-errors \
              --output /dev/null --write-out "$1/ : %{http_code} en %{time_total} s\n" "$1/" || return 1
            local corps
            corps="$(curl --fail --silent --show-error --max-time 20 --retry 4 --retry-delay 10 --retry-all-errors "$1/api/reveil")" || return 1
            echo "$1/api/reveil : $corps"
            [ "$(jq -r '.ok' <<< "$corps" 2>/dev/null)" = "true" ]
          }
          # L’adresse du déploiement que sert le domaine ; rien si Vercel ne la donne pas
          enLigne() { "$VERCEL" inspect "$DOMAINE" --format json --token "$VERCEL_TOKEN" | jq -er '.url | select(. != null) | "https://" + .' || true; }

          statut="$(curl --silent --output /dev/null --max-time 20 --write-out '%{http_code}' "$URL/api/reveil" || true)"
          if [ "$statut" = "401" ] || [ "$statut" = "403" ]; then
            echo "::notice::$URL est protégé par Vercel ($statut) : vérifié par le domaine seulement."
          else
            repond "$URL" || { echo "::error::$URL ne répond pas comme il faut"; exit 1; }
          fi

          # Après un retour arrière, Vercel ne met plus de lui-même les déploiements suivants sur le domaine : on l’y met.
          # Sans réponse de Vercel sur ce qu’il sert, le domaine se vérifie tel quel.
          sert="$(enLigne)"
          if [ -z "$sert" ]; then
            echo "::warning::Vercel ne dit pas quel déploiement sert $DOMAINE : vérifié tel quel."
          elif [ "$sert" != "$URL" ]; then
            echo "::notice::$DOMAINE sert $sert, pas encore $URL : vercel promote."
            "$VERCEL" promote "$URL" --yes --timeout 3m --token "$VERCEL_TOKEN"
            test "$(enLigne)" = "$URL" || { echo "::error::$DOMAINE ne sert toujours pas $URL"; exit 1; }
          fi
          repond "$DOMAINE" || { echo "::error::$DOMAINE ne répond pas comme il faut avec $URL"; exit 1; }

      # Le nouveau déploiement ne répond pas : le déploiement d’avant revient en ligne, et le job reste en échec (GitHub
      # prévient celui qui a lancé la mise en production). Vercel ne mettra plus les suivants sur le domaine de lui-même :
      # la prochaine mise en production l’y met (vercel promote, plus haut), une fois corrigé ce qui coinçait.
      - name: Retour au déploiement d’avant
        if: failure() && steps.verifier.outcome == 'failure' && steps.avant.outputs.id != ''
        env:
          AVANT: ${{ steps.avant.outputs.id }}
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$VERCEL" rollback "$AVANT" --yes --timeout 3m --token "$VERCEL_TOKEN"
          echo "::error::$URL ne répondait pas : $AVANT est revenu en ligne. Regarde ses logs dans Vercel (une variable d’environnement refusée, la base), corrige, puis relance la mise en production."
